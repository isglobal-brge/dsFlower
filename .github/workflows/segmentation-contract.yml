name: Binary segmentation contract

on:
  push:
    paths:
      - "inst/flower_app/dsflower_runner/**"
      - "inst/python/tests/test_segmentation_contracts.py"
      - ".github/workflows/segmentation-contract.yml"
  pull_request:
    paths:
      - "inst/flower_app/dsflower_runner/**"
      - "inst/python/tests/test_segmentation_contracts.py"
      - ".github/workflows/segmentation-contract.yml"

jobs:
  subject-gradients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch==2.4.1 torchvision==0.19.1 opacus==1.5.4 flwr==1.31.0 pytest pandas pillow cryptography
      - name: Pin public checkpoint
        run: |
          mkdir -p "$HOME/.cache/torch/hub/checkpoints"
          curl --fail --location https://download.pytorch.org/models/resnet18-f37072fd.pth -o "$HOME/.cache/torch/hub/checkpoints/resnet18-f37072fd.pth"
          echo "f37072fd47e89c5e827621c5baffa7500819f7896bbacec160b1a16c560e07ec  $HOME/.cache/torch/hub/checkpoints/resnet18-f37072fd.pth" | sha256sum --check
      - run: python -m pytest -q inst/python/tests/test_segmentation_contracts.py inst/python/tests/test_dpsgd_guards.py inst/python/tests/test_release_guard.py inst/python/tests/test_runner_contracts.py
