name: Neural survival contracts

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/survival-python.yml"
      - ".github/survival-python-requirements.txt"
      - "inst/flower_app/dsflower_runner/**"
      - "inst/python/tests/test_survival_contracts.py"
      - "R/survival.R"
      - "R/staging.R"
      - "R/interface.R"
      - "R/policy.R"
      - "R/python_env.R"
      - "tests/testthat/test-survival.R"
  pull_request:
    paths:
      - ".github/workflows/survival-python.yml"
      - ".github/survival-python-requirements.txt"
      - "inst/flower_app/dsflower_runner/**"
      - "inst/python/tests/test_survival_contracts.py"
      - "R/survival.R"
      - "R/staging.R"
      - "R/interface.R"
      - "R/policy.R"
      - "R/python_env.R"
      - "tests/testthat/test-survival.R"

permissions:
  contents: read

jobs:
  test:
    name: Subject loss, gradients, accountant and authority
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - name: Install pinned CPU survival profile
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install --disable-pip-version-check -r .github/survival-python-requirements.txt
          python -m pip check
      - name: Record revision and runtime
        run: |
          git rev-parse HEAD
          python -m pip freeze
          python -c 'import torch; assert not torch.cuda.is_available(), "CI requires CPU execution"'
      - name: Run survival mathematical and mechanism gates
        run: python -m unittest -v inst/python/tests/test_survival_contracts.py
