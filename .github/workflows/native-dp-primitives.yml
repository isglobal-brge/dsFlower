name: Native DP primitives

on:
  push:
    paths:
      - ".github/workflows/native-dp-primitives.yml"
      - "native/dp_primitives/**"
  pull_request:
    paths:
      - ".github/workflows/native-dp-primitives.yml"
      - "native/dp_primitives/**"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Check formatting and lints
        run: |
          cargo fmt --manifest-path native/dp_primitives/Cargo.toml -- --check
          cargo clippy --manifest-path native/dp_primitives/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test Rust implementation
        run: cargo test --manifest-path native/dp_primitives/Cargo.toml --locked
      - name: Build release C ABI
        run: cargo build --manifest-path native/dp_primitives/Cargo.toml --release --locked
      - name: Test C ABI and source pins
        run: |
          python native/dp_primitives/tests/abi_smoke.py
          python native/dp_primitives/tests/test_metadata.py
      - name: Audit locked dependency graph
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file native/dp_primitives/Cargo.lock
      - name: Verify third-party license inventory
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo install cargo-about --version 0.9.1 --locked --features cli
          cd native/dp_primitives
          cargo about generate --config about.toml --output-file /tmp/dsflower-third-party.html about.hbs
          perl -pi -e 's/\r$//; s/[ \t]+$//' /tmp/dsflower-third-party.html
          diff -u THIRD_PARTY_LICENSES.html /tmp/dsflower-third-party.html
      - name: Link and run C and C++ consumers (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          target="$PWD/native/dp_primitives/target/release"
          cc -std=c11 -Wall -Wextra -Werror -Inative/dp_primitives/include \
            native/dp_primitives/tests/header_smoke.c -L"$target" \
            -ldsflower_dp_primitives -Wl,-rpath,"$target" \
            -o "$target/header-smoke-c"
          c++ -std=c++17 -Wall -Wextra -Werror -Inative/dp_primitives/include \
            -x c++ native/dp_primitives/tests/header_smoke.c -L"$target" \
            -ldsflower_dp_primitives -Wl,-rpath,"$target" \
            -o "$target/header-smoke-cpp"
          "$target/header-smoke-c"
          "$target/header-smoke-cpp"
      - name: Compile C and C++ headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = (Resolve-Path native/dp_primitives/target/release).Path
          $import = Get-ChildItem $target -Filter "dsflower_dp_primitives.dll.lib" | Select-Object -First 1
          if ($null -eq $import) { throw "Rust import library was not produced" }
          $source = (Resolve-Path native/dp_primitives/tests/header_smoke.c).Path
          $include = (Resolve-Path native/dp_primitives/include).Path
          & cl /nologo /W4 /WX /TC "/I$include" $source "/Fe:$target/header-smoke-c.exe" /link "/LIBPATH:$target" $import.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cl /nologo /W4 /WX /TP "/I$include" $source "/Fe:$target/header-smoke-cpp.exe" /link "/LIBPATH:$target" $import.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$target/header-smoke-c.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$target/header-smoke-cpp.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
