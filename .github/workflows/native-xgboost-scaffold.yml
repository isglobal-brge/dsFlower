permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      DSFLOWER_XGB_BUILD_JOBS: "4"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Pin Cargo to the MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = (& where.exe link.exe) |
            Where-Object { $_ -and $_ -notmatch '[\\/]Git[\\/]usr[\\/]bin[\\/]link\.exe$' } |
            Select-Object -First 1
          if (-not $linker -or -not (Test-Path -LiteralPath $linker)) {
            throw 'MSVC link.exe was not found after initializing the Visual Studio environment'
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate Python contracts
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/xgb-contract-venv"
          if [ "$RUNNER_OS" = "Windows" ]; then
            contract_python="$RUNNER_TEMP/xgb-contract-venv/Scripts/python.exe"
          else
            contract_python="$RUNNER_TEMP/xgb-contract-venv/bin/python"
          fi
          "$contract_python" -m pip install --disable-pip-version-check \
            flwr==1.31.0 \
            numpy==2.4.6 \
            pandas==3.0.3 \
            pyarrow==23.0.1 \
            cryptography==46.0.7 \
            'torch>=2.0.0,<3.0.0' \
            monai==1.3.0 \
            'opacus>=1.4.0,<2.0.0'
          # setup-python exports loader paths on some runners, while the
          # custodial bundle contract requires the production-clean environment.
          for loader_var in $(compgen -e); do
            case "$loader_var" in LD_*|DYLD_*) unset "$loader_var" ;; esac
          done
          "$contract_python" -m unittest -v \
            inst/python/tests/test_native_tree_contract.py \
            inst/python/tests/test_native_tree_engine.py \
            inst/python/tests/test_native_tree_flower_app.py \
            inst/python/tests/test_native_tree_predictor_batch.py \
            inst/python/tests/test_native_tree_validation_app.py \
            inst/python/tests/test_boosting_adapter.py \
            inst/python/tests/test_boosting_artifacts.py \
            inst/python/tests/test_forest_adapter.py \
            inst/python/tests/test_random_forest_adapter.py \
            inst/python/tests/test_tree_release.py \
            inst/python/tests/test_cross_validation.py \
            inst/python/tests/test_dpsgd_guards.py \
            inst/python/tests/test_holdout.py \
            inst/python/tests/test_epi_association.py \
            inst/python/tests/test_association_flower_app.py \
            inst.python.tests.test_validation_dp.ValidationSensitivityTests \
            inst.python.tests.test_validation_dp.ValidationReleaseTests \
            inst.python.tests.test_validation_dp.ValidationInferenceTests \
            inst/python/tests/test_sitecustomize.py \
            inst/python/tests/test_xgboost_accounting.py \
            inst/python/tests/test_xgboost_adapter.py \
            inst/python/tests/test_xgboost_sanitizer.py \
            inst/python/tests/test_xgboost_bundle.py \
            inst/python/tests/test_xgboost_native.py \
            inst/python/tests/test_xgboost_predictor.py
      - name: Verify fail-closed build and curated DP bundle
        shell: bash
        run: |
          for loader_var in $(compgen -e); do
            case "$loader_var" in LD_*|DYLD_*) unset "$loader_var" ;; esac
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            e2e_python="$RUNNER_TEMP/xgb-contract-venv/Scripts/python.exe"
          else
            e2e_python="$RUNNER_TEMP/xgb-contract-venv/bin/python"
          fi
          DSFLOWER_XGB_E2E_PYTHON="$e2e_python" \
            native/xgboost/tests/run.sh
