name: Native XGBoost scaffold

on:
  push:
    paths:
      - ".github/workflows/native-xgboost-scaffold.yml"
      - "native/xgboost/**"
  pull_request:
    paths:
      - ".github/workflows/native-xgboost-scaffold.yml"
      - "native/xgboost/**"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      DSFLOWER_XGB_BUILD_JOBS: "4"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify, build, and exercise fail-closed ABI
        shell: bash
        run: native/xgboost/tests/run.sh
