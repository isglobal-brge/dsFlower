name: Native XGBoost scaffold

on:
  push:
    paths:
      - ".github/workflows/native-xgboost-scaffold.yml"
      - "inst/flower_app/dsflower_runner/native_tree_contract.py"
      - "inst/flower_app/dsflower_runner/seeding.py"
      - "inst/flower_app/dsflower_runner/xgboost_*.py"
      - "inst/python/tests/test_native_tree_contract.py"
      - "inst/python/tests/test_xgboost_*.py"
      - "native/xgboost/**"
      - "native/dp_primitives/**"
  pull_request:
    paths:
      - ".github/workflows/native-xgboost-scaffold.yml"
      - "inst/flower_app/dsflower_runner/native_tree_contract.py"
      - "inst/flower_app/dsflower_runner/seeding.py"
      - "inst/flower_app/dsflower_runner/xgboost_*.py"
      - "inst/python/tests/test_native_tree_contract.py"
      - "inst/python/tests/test_xgboost_*.py"
      - "native/xgboost/**"
      - "native/dp_primitives/**"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      DSFLOWER_XGB_BUILD_JOBS: "4"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Validate Python contracts
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/xgb-contract-venv"
          if [ "$RUNNER_OS" = "Windows" ]; then
            contract_python="$RUNNER_TEMP/xgb-contract-venv/Scripts/python.exe"
          else
            contract_python="$RUNNER_TEMP/xgb-contract-venv/bin/python"
          fi
          "$contract_python" -m pip install --disable-pip-version-check numpy==2.4.6
          "$contract_python" -m unittest -v \
            inst/python/tests/test_native_tree_contract.py \
            inst/python/tests/test_xgboost_accounting.py \
            inst/python/tests/test_xgboost_adapter.py \
            inst/python/tests/test_xgboost_sanitizer.py
      - name: Verify normal fail-closed build and isolated DP core
        shell: bash
        run: native/xgboost/tests/run.sh
